[package]
name = "gamblium-dl"
version = "0.7.1"
edition = "2021"
description = "Gamblium's own downloader: split HTTP downloads with an adaptive number of connections, several sources, resume"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
# Torrents and magnet links. rustls, like the rest; no HTTP API, no UI.
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
