[package]
name = "gamblium-lyrics"
version = "1.1.0"
edition = "2021"
description = "Gamblium's floating lyrics window (issue #242): synced lyrics on top of every app"
license = "MIT"

[[bin]]
name = "gamblium-lyrics"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
cosmic-text = "0.12"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
] }
