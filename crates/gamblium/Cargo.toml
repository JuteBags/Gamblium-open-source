[package]
name = "gamblium"
version = "1.0.0"
edition = "2021"
description = "Gamblium companion CLI: process stats and launcher for the Brave base"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Window pictures of the browser's own pages (capture.rs).
png = "0.17"
# Packing stopped sessions small (pack.rs).
tar = "0.4"
# Checking a downloaded update against the release's checksum (update.rs).
sha2 = "0.10"
zstd = { version = "0.13", features = ["zstdmt"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
ureq = "2"
getrandom = "0.2"
url = "2"
# Sealing the login cookie of an unfinished download (vault.rs).
chacha20poly1305 = "0.10"
# One short conversation with the browser's own extensions page (private.rs).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[build-dependencies]
winresource = "0.1"
