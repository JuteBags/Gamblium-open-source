# Unit tests on every pull request (and by hand). Nothing is built for release here.
name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests (launcher, helper, downloader)
        run: cargo test --workspace --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extension tests
        shell: bash
        run: node --test $(git ls-files 'extension/*.test.mjs' 'extension/**/*.test.mjs')
      - name: Command reference up to date (docs and the agent skill)
        run: node tools/gen-agent-docs.mjs --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patcher tests
        run: |
          python -m pip install --quiet pillow numpy
          python -I tools/rebrand/test_rebrand.py
          python -I tools/rebrand/test_extra.py
