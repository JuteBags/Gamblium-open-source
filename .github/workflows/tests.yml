# Unit tests on every push to main and every pull request (and by hand). Nothing is built here:
# builds and installs happen on the owner's machine; release.yml builds only for a version tag.
# The public repository (JuteBags/Gamblium-open-source) gets main as one sync commit per publish
# (tools/publish-public.mjs), so a push there runs these tests with free Actions minutes.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests (launcher, helper, downloader)
        run: cargo test --workspace --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extension tests
        shell: bash
        run: node --test $(git ls-files 'extension/*.test.mjs' 'extension/**/*.test.mjs')
      - name: Command reference up to date (docs and the agent skill)
        run: node tools/gen-agent-docs.mjs --check
      - name: Public export leaves out private files
        run: node --test tools/publish-public.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patcher tests
        run: |
          python -m pip install --quiet pillow numpy
          python -I tools/rebrand/test_rebrand.py
          python -I tools/rebrand/test_extra.py
