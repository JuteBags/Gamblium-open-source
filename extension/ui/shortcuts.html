<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard shortcuts · Gamblium</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<script src="scheme.js"></script>
<script src="../content/menu.js" defer></script>
</head>
<body>
<header class="bar">
  <img class="mark" alt="" width="22" height="22">
  <span class="product">Gamblium</span>
  <nav aria-label="Gamblium pages">
    <a href="dashboard.html">Tabs and memory</a>
    <span class="navhead">Library</span>
    <a class="sub" href="history.html">History</a>
    <a class="sub" href="downloads.html">Downloads</a>
    <a class="sub" href="sessions.html">Sessions</a>
    <a href="security.html">Security</a>
    <a href="settings.html" aria-current="page">Settings</a>
  </nav>
</header>

<main class="page">
  <div class="title">
    <h1>Keyboard shortcuts</h1>
    <p id="line">Reading…</p>
  </div>

  <div id="readonly" class="notice" role="status" hidden></div>

  <section class="panel" aria-label="Commands and their keys">
    <div class="toolbar">
      <input id="kq" type="search" placeholder="Search commands or keys, such as “tab” or “Ctrl+Shift”" aria-label="Search shortcuts" autocomplete="off" spellcheck="false">
      <span class="grow"></span>
      <span id="saved" class="saved" role="status"></span>
      <button type="button" id="resetAll" class="quiet">Reset all</button>
    </div>
    <p id="none" class="empty" hidden>No command matches.</p>
    <div id="groups" class="keygroups"></div>
  </section>
</main>

<script type="module" src="shortcuts.js"></script>
</body>
</html>
