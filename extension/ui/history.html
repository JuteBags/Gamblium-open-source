<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · Gamblium</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<script src="scheme.js"></script>
<script src="../content/menu.js" defer></script>
</head>
<body>
<header class="bar">
  <img class="mark" alt="" width="22" height="22">
  <span class="product">Gamblium</span>
  <nav aria-label="Gamblium pages">
    <a href="dashboard.html">Tabs and memory</a>
    <a href="history.html" aria-current="page">History</a>
    <a href="security.html">Security</a>
    <a href="settings.html">Settings</a>
  </nav>
</header>

<main class="page">
  <div class="title">
    <h1>History</h1>
    <p id="line">Reading…</p>
  </div>

  <section class="panel" aria-label="Pages you visited">
    <div class="toolbar">
      <input id="hq" type="search" placeholder="Search by name or address" aria-label="Search history" autocomplete="off" spellcheck="false">
      <div id="whens" class="seg" role="group" aria-label="When"></div>
    </div>
    <div id="said" class="notice" role="status" hidden></div>
    <p id="none" class="empty" hidden>Nothing here for that search and time.</p>
    <div id="days" class="days"></div>
    <div class="more"><button type="button" id="more" hidden>Show more</button></div>
  </section>
</main>

<script type="module" src="history.js"></script>
</body>
</html>
