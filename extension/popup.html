<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Gamblium</title>
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="ui/spaces.css">
<script src="ui/scheme.js"></script>
</head>
<body class="popup">
<header class="bar">
  <img class="mark" alt="" width="22" height="22">
  <span class="product">Gamblium</span>
  <span id="label" class="pill" hidden></span>
  <span class="sub" id="memory">&nbsp;</span>
</header>

<!-- Three views: the browser's menu, the open tabs, and the site in front of you. -->
<div class="views" role="tablist" aria-label="View">
  <button type="button" id="vMenu" role="tab" aria-controls="viewMenu" aria-selected="true">Menu</button>
  <button type="button" id="vBrowser" role="tab" aria-controls="viewBrowser" aria-selected="false">Tabs</button>
  <button type="button" id="vSite" role="tab" aria-controls="viewSite" aria-selected="false">This site</button>
</div>

<div id="viewMenu" role="tabpanel" aria-labelledby="vMenu">
<!-- Brave's own menu, item for item and in its order, then ours. Rows with a > open a flyout on hover. -->
<div class="zoom" role="group" aria-label="Zoom">
  <svg class="zicon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8.500" cy="8.500" r="5"/><path d="m12.300 12.300 4.200 4.200"/></svg>
  <span class="zlabel">Zoom</span>
  <button type="button" id="zoomOut" class="zbtn" title="Smaller (Ctrl+-)" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
  <button type="button" id="zoomNow" class="zvalue" title="Back to 100% (Ctrl+0)">100%</button>
  <button type="button" id="zoomIn" class="zbtn" title="Bigger (Ctrl++)" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
  <button type="button" id="fullScreen" class="zbtn zfull" title="Full screen (F11)" aria-label="Full screen"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg></button>
</div>
<div id="menuRows" class="mrows" role="menu" aria-label="Menu"></div>
<div id="flyout" class="flyout" role="menu" hidden></div>
<p class="said" id="menuSaid" role="status"></p>
</div>

<div id="viewSite" role="tabpanel" aria-labelledby="vSite" hidden>
<section id="site" aria-labelledby="siteHost" hidden>
  <div class="sitehead">
    <img id="siteIcon" class="fav" alt="" width="20" height="20">
    <h2 id="siteHost"></h2>
    <span id="secure" class="pill"></span>
  </div>
  <!-- Quick actions for the page in front. -->
  <div class="quickacts">
    <button type="button" id="actMark" title="Bookmark this page"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h8a1 1 0 0 1 1 1V17l-5-3.2L5 17V4.5a1 1 0 0 1 1-1z"/></svg><span>Bookmark</span></button>
    <button type="button" id="actShot" title="Save a picture of what the page shows"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.500 6h2l1.200-2h4.600L13.500 6h2A1.500 1.500 0 0 1 17 7.500v7a1.500 1.500 0 0 1-1.500 1.500h-11A1.500 1.500 0 0 1 3 14.500z"/><circle cx="10" cy="11" r="2.800"/></svg><span>Screenshot</span></button>
    <button type="button" id="actCopy" title="Copy the page's address"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.500 11.500a3 3 0 0 0 4.200 0l2.800-2.800a3 3 0 0 0-4.200-4.200l-.800.800"/><path d="M11.500 8.500a3 3 0 0 0-4.200 0l-2.800 2.800a3 3 0 0 0 4.200 4.200l.800-.800"/></svg><span>Copy address</span></button>
    <button type="button" id="actMd" title="Copy as a Markdown link: [title](address)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.500A1.500 1.500 0 0 1 4.500 5h11A1.500 1.500 0 0 1 17 6.500v7a1.500 1.500 0 0 1-1.500 1.500h-11A1.500 1.500 0 0 1 3 13.500z"/><path d="M5.800 12.500v-5l2 2.500 2-2.500v5M13.200 7.500v5m-1.700-1.700 1.700 1.700 1.700-1.700"/></svg><span>Markdown</span></button>
  </div>
  <p class="said" id="siteSaid" role="status"></p>
  <div class="checks">
    <label class="check"><input type="checkbox" id="awakeTab"> Keep this tab awake</label>
    <label class="field" for="temp">
      <span id="tempText">Background level for this site</span>
      <input type="range" id="temp" min="0" max="273" step="39" list="tempStops" style="width: 100%">
    </label>
    <label class="check"><input type="checkbox" id="neverSleep"> Never put this site to sleep</label>
    <label class="check" id="jsOffRow"><input type="checkbox" id="jsOff"> Switch JavaScript off on this site</label>
    <label class="check" id="keepLightRow"><input type="checkbox" id="keepLight"> Keep this site light when dark mode is forced</label>
  </div>
  <nav class="links sitelinks" aria-label="More for this site">
    <a href="ui/security.html" data-page="ui/security.html" id="securityLink">Security for this site</a>
  </nav>
</section>
</div>

<div id="viewBrowser" role="tabpanel" aria-labelledby="vBrowser" hidden>
<!-- Spaces: this window's tab groups, on top of the tab list; shown once the window has one (popup.js, spaces.js). -->
<nav class="spacerow" id="spaceRow" aria-label="Spaces" hidden><ul id="spaceChips"></ul></nav>
<!-- The most common job first: find a tab and go to it. -->
<section aria-label="Find a tab" class="finder">
  <input id="find" type="search" placeholder="Search open tabs" aria-label="Search open tabs" aria-controls="tablist" autocomplete="off" spellcheck="false">
  <ul id="tablist" class="tablist" role="listbox" aria-label="Open tabs"></ul>
  <p id="nomatch" class="said" hidden>No open tab matches.</p>
</section>

<section aria-label="Tabs">
  <div class="spread">
    <p class="count" id="count">&nbsp;</p>
    <ul class="legend" id="legend"></ul>
  </div>
  <div class="split" id="split" role="img" aria-label=""><i class="awake"></i><i class="frozen"></i><i class="asleep"></i></div>
  <div class="actions">
    <button id="thisWindow" type="button" class="primary">Sleep hidden tabs</button>
    <button id="otherWindows" type="button">Sleep other windows</button>
  </div>
  <p class="said" id="said" role="status"></p>
</section>

<section aria-label="Automatic sleep">
  <label class="check"><input type="checkbox" id="enabled"> <span id="enabledText">Put hidden tabs to sleep</span></label>
</section>

<nav class="links" aria-label="Gamblium pages">
  <a href="ui/dashboard.html" data-page="ui/dashboard.html">Tabs and memory</a>
  <a href="ui/sessions.html" data-page="ui/sessions.html">Sessions</a>
</nav>
</div>

<div id="agent" class="notice warn" hidden>Command-line agents can control this profile. Switch it off in Settings.</div>

<script type="module" src="popup.js"></script>
</body>
</html>
